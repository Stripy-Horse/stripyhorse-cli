# GoReleaser config for the stripyhorse CLI. Cross-compiles a static binary
# for every OS and (later) publishes archives + a Homebrew tap.
#   goreleaser release --clean
version: 2

project_name: stripyhorse

builds:
  - id: stripyhorse
    binary: stripyhorse
    main: ./cmd/stripyhorse
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: stripyhorse
    name_template: "stripyhorse_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Stripy-Horse
    name: stripyhorse-cli

# Uncomment once a Stripy-Horse/homebrew-tap repo exists:
# brews:
#   - repository:
#       owner: Stripy-Horse
#       name: homebrew-tap
#     homepage: https://stripyhorse.io
#     description: Command-line client for the Stripy Horse API

# GoReleaser config for the stripyhorse CLI. Cross-compiles a static binary
# for every OS, publishes archives + checksums to a GitHub release, and updates
# a Homebrew formula. Run by .github/workflows/release.yml on a v* tag; locally:
#   goreleaser release --clean            # real release
#   goreleaser build --snapshot --clean   # just build, no publish
version: 2

project_name: stripyhorse

builds:
  - id: stripyhorse
    binary: stripyhorse
    main: ./cmd/stripyhorse
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: stripyhorse
    name_template: "stripyhorse_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Stripy-Horse
    name: stripyhorse-cli
  # install.sh (served from the repo) fetches these release assets.
